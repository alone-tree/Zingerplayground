{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}
{{ define "main" }}
<div class="container-narrow">
  <article class="about-page">
    <h1>{{ .Title }}</h1>
    <div class="about-content">
      {{ .Content }}
    </div>

    <!-- 社交链接 -->
    <div class="about-social">
      <div class="about-social-inner">
        <div class="social-block social-block-wechat">
          <span class="social-label">微信公众号：清醒杂货店</span>
          <img src="/images/qrcode-wechat.jpg" alt="公众号二维码" class="qrcode-img" loading="lazy" />
        </div>
        Reddit： <a href="https://www.reddit.com/user/Mountain_Ad8731/" class="social-link" target="_blank" rel="noopener">Mountain_Ad8731</a>
        GitHub： <a href="https://github.com/alone-tree" class="social-link" target="_blank" rel="noopener">alone-tree</a>
      </div>
    </div>
  </article>
</div>

<style>
.about-page {
  padding: var(--spacing-lg) 0;
}
.about-page h1 {
  text-align: center;
  margin-bottom: var(--spacing-lg);
  font-size: 2rem;
}
.about-content {
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.8;
}
.about-content h2 {
  font-size: 1.4rem;
  margin-top: var(--spacing-lg);
  margin-bottom: var(--spacing-sm);
}
.about-content hr {
  border: none;
  border-top: 1px solid var(--border-color);
  margin: var(--spacing-lg) 0;
}

/* 社交链接行 */
.about-social {
  margin-top: var(--spacing-xl);
  padding-top: var(--spacing-lg);
  border-top: 1px solid var(--border-color);
}
.about-social-inner {
  display: flex;
  gap: 2.5rem;
  align-items: flex-start;
}
.social-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}
.social-block-wechat {
  align-items: flex-start;
}
.social-label {
  font-size: 0.85rem;
  color: var(--text-color);
}
.social-link {
  font-size: 0.95rem;
  color: var(--link-color);
  text-decoration: none;
}
.social-link:hover {
  text-decoration: underline;
}
.qrcode-img {
  width: 100px;
  height: 100px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
}
</style>
{{ end }}
