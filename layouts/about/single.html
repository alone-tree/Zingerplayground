{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}
{{ define "main" }}
<div class="container-narrow">
  <article class="about-page">
    <h1>{{ .Title }}</h1>
    <div class="about-content">
      {{ .Content }}
    </div>

    <div class="about-social">
      <div class="social-col">
        <div class="social-label">微信公众号：清醒杂货店</div>
        <img src="/images/qrcode-wechat.jpg" alt="公众号二维码" class="social-qrcode" loading="lazy" />
      </div>
      <div class="social-col social-col-link">
        <span class="social-label">GitHub：</span>
        <a href="https://github.com/alone-tree" class="social-handle" target="_blank" rel="noopener">alone-tree</a>
      </div>
      <div class="social-col social-col-link">
        <span class="social-label">Reddit：</span>
        <a href="https://www.reddit.com/user/Mountain_Ad8731/" class="social-handle" target="_blank" rel="noopener">Mountain_Ad8731</a>
      </div>
    </div>
  </article>
</div>

<style>
.about-page {
  padding: var(--spacing-lg) 0;
}
.about-page h1 {
  text-align: center;
  margin-bottom: var(--spacing-lg);
  font-size: 2rem;
}
.about-content {
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.8;
}
.about-content h2 {
  font-size: 1.4rem;
  margin-top: var(--spacing-lg);
  margin-bottom: var(--spacing-sm);
}
.about-content hr {
  border: none;
  border-top: 1px solid var(--border-color);
  margin: var(--spacing-lg) 0;
}

/* 社交链接 - 桌面三列 */
.about-social {
  margin-top: var(--spacing-xl);
  padding-top: var(--spacing-lg);
  border-top: 1px solid var(--border-color);
  display: flex;
  gap: 2.5rem;
}
.social-col {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.social-label {
  font-size: 0.9rem;
  color: var(--text-color);
  font-family: var(--font-sans);
}
.social-qrcode {
  width: 100px;
  height: auto;
  border-radius: 4px;
  border: 1px solid var(--border-color);
}
.social-handle {
  font-size: 0.9rem;
  color: var(--link-color);
  text-decoration: none;
  font-family: var(--font-sans);
}
.social-handle:hover {
  text-decoration: underline;
}

/* 移动端 */
@media (max-width: 600px) {
  .about-social {
    flex-direction: column;
    gap: 0.8rem;
  }
  .social-col-link {
    flex-direction: row;
    align-items: baseline;
  }
}
</style>
{{ end }}
