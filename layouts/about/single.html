{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}
{{ define "main" }}
<div class="container-narrow">
  <article class="about-page">
    <h1>{{ .Title }}</h1>
    <div class="about-content">
      {{ .Content }}
    </div>

    <!-- 社交链接 -->
    <div class="about-social">
      <h2>其他的平台</h2>

      <div class="social-item">
        <span class="social-label">微信公众号：清醒杂货店</span>
        <div class="social-qrcode">
          <img src="/images/qrcode-wechat.jpg" alt="公众号二维码" loading="lazy" />
        </div>
      </div>

      <div class="social-links">
        <a href="https://www.reddit.com/user/Mountain_Ad8731/" class="social-link" target="_blank" rel="noopener">Reddit</a>
        <a href="https://github.com/alone-tree" class="social-link" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </article>
</div>

<style>
.about-page {
  padding: var(--spacing-lg) 0;
}
.about-page h1 {
  text-align: center;
  margin-bottom: var(--spacing-lg);
  font-size: 2rem;
}
.about-content {
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.8;
}
.about-content h2 {
  font-size: 1.4rem;
  margin-top: var(--spacing-lg);
  margin-bottom: var(--spacing-sm);
}
.about-content hr {
  border: none;
  border-top: 1px solid var(--border-color);
  margin: var(--spacing-lg) 0;
}

/* 社交链接 */
.about-social {
  margin-top: var(--spacing-xl);
  padding-top: var(--spacing-lg);
  border-top: 1px solid var(--border-color);
}
.about-social h2 {
  font-size: 1.1rem;
  margin-bottom: var(--spacing-md);
}
.social-item {
  margin-bottom: var(--spacing-sm);
}
.social-label {
  display: block;
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
}
.social-qrcode {
  display: inline-block;
}
.social-qrcode img {
  width: 120px;
  height: auto;
  border-radius: 4px;
  border: 1px solid var(--border-color);
}
.social-links {
  display: flex;
  gap: 1.5rem;
  margin-top: var(--spacing-sm);
}
.social-link {
  font-size: 0.95rem;
  color: var(--link-color);
  text-decoration: none;
}
.social-link:hover {
  text-decoration: underline;
}
</style>
{{ end }}
